# XcodeGen (A9): `xcodegen generate` → Atlagsebesseg.xcodeproj (a projektfájl generált, nincs a repóban).
name: Atlagsebesseg
options:
  bundleIdPrefix: hu.atlagsebesseg
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    # a String Catalog generált (npm run generate) – az Xcode ne írja bele a kódban talált szövegeket
    SWIFT_EMIT_LOC_STRINGS: NO
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: ""

packages:
  AtlagsebessegCore:
    path: ../../packages/core-swift
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios.git
    exactVersion: 11.26.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.5

targets:
  Atlagsebesseg:
    type: application
    platform: iOS
    sources:
      - path: Atlagsebesseg
      # ugyanazok az adatfájlok, mint a weben (offline tartalék és a kamera-láthatóság szabálya)
      - path: ../../packages/data/camera_visibility.json
        group: SharedData
        buildPhase: resources
      - path: ../../packages/data/output
        group: SharedData
        type: folder
        buildPhase: resources
    dependencies:
      - package: AtlagsebessegCore
        product: AtlagsebessegCore
      - package: MapboxMaps
        product: MapboxMaps
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.atlagsebesseg.app
        PRODUCT_NAME: Atlagsebesseg
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Atlagsebesseg/Info.plist
      properties:
        CFBundleDisplayName: Atlagsebesseg
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, hu, de, sk, cs, pl]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [location]
        # alapszöveg; a nyelvenkénti változat az InfoPlist.xcstrings-ből (a szótárból generálva)
        NSLocationWhenInUseUsageDescription: Your location is needed to detect sections and measure your average speed.
        ITSAppUsesNonExemptEncryption: false
        # a titkok az xcconfig-ból (Secrets.xcconfig, gitignore) – üresen az app offline, a beépített adattal fut
        MBXAccessToken: $(MAPBOX_ACCESS_TOKEN)
        AtlSupabaseURL: $(SUPABASE_URL)
        AtlSupabaseAnonKey: $(SUPABASE_ANON_KEY)

  AtlagsebessegTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AtlagsebessegTests
    dependencies:
      - target: Atlagsebesseg
      - package: AtlagsebessegCore
        product: AtlagsebessegTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: hu.atlagsebesseg.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Atlagsebesseg.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Atlagsebesseg
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Atlagsebesseg:
    build:
      targets:
        Atlagsebesseg: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AtlagsebessegTests
        - package: AtlagsebessegCore/AtlagsebessegCoreTests
